# moveit_controllers.yaml — JAKA S12 + Custom Gripper
# =====================================================
# MoveIt controller manager configuration.
# Maps MoveIt planning groups to ros2_control action servers.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - jaka_s12_controller
    - custom_gripper_controller

  jaka_s12_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

  custom_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - jaw_left_joint

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false
  moveit_manage_controllers: true
