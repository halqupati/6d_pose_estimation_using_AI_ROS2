# ros2_controllers.yaml — JAKA S12 + Custom Gripper
# ===================================================
# Controls:
#   jaka_s12_controller      : arm (joint_1 … joint_6)
#   custom_gripper_controller: gripper (jaw_left_joint)
#   joint_state_broadcaster  : publishes /joint_states

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    jaka_s12_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    custom_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


jaka_s12_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity


custom_gripper_controller:
  ros__parameters:
    joints:
      - jaw_left_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
