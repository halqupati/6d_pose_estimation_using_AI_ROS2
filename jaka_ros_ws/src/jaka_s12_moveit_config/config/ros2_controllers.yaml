# ros2_controllers.yaml — JAKA S12 + Custom Gripper
# ===================================================
# Controls:
#   jaka_s12_controller      : arm (joint_1 … joint_6)
#   custom_gripper_controller: gripper (jaw_left_joint)
#   joint_state_broadcaster  : publishes /joint_states
#   [Solved]Adding    interfaces: - position - velocity in joint_state_broadcaster solve [move_group-2] [ERROR] [1775680549.120382542] [moveit_robot_model.robot_model]: Joint 'gripper_jaw_right_joint_mimic' not found in model 'jaka_s12' 

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    jaka_s12_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    custom_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      joints:
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5
        - joint_6
        - gripper_jaw_left_joint
      interfaces:
        - position
        - velocity


jaka_s12_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity


custom_gripper_controller:
  ros__parameters:
    joints:
      - gripper_jaw_left_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - gripper_jaw_left_joint
    interfaces:
      - position
      - velocity
